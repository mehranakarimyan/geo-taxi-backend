<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Geo-Taxi Dispatch Console</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0D10;
    --panel: #12151A;
    --line: #262B33;
    --text: #E8E6DF;
    --muted: #7C8592;
    --amber: #F2B705;
    --teal: #3FA796;
    --slate: #4B5563;
    --brick: #C1443C;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background-color: var(--bg);
    color: var(--text);
    font-family: "IBM Plex Sans", Arial, sans-serif;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 48px 48px;
    background-attachment: fixed;
  }
  .mono { font-family: "IBM Plex Mono", Consolas, monospace; }

  header {
    padding: 16px 28px;
    border-bottom: 1px solid var(--line);
    background: rgba(11, 13, 16, 0.92);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  header .title { font-size: 15px; font-weight: 600; letter-spacing: 0.06em; }
  header .title .dim { color: var(--muted); font-weight: 400; }
  header .clock {
    font-family: "IBM Plex Mono", Consolas, monospace;
    font-size: 15px;
    color: var(--amber);
    letter-spacing: 0.06em;
  }

  .stat-strip {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  .stat { padding: 16px 24px; border-left: 1px solid var(--line); }
  .stat:first-child { border-left: none; }
  .stat .val {
    font-family: "IBM Plex Mono", Consolas, monospace;
    font-size: 30px;
    font-weight: 500;
    color: var(--amber);
    line-height: 1;
  }
  .stat.teal .val { color: var(--teal); }
  .stat .lbl {
    font-size: 11px;
    color: var(--muted);
    margin-top: 8px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .layout {
    display: grid;
    grid-template-columns: 1.5fr 1fr;
    gap: 1px;
    background: var(--line);
  }
  .panel { background: var(--bg); padding: 18px 22px; }

  .panel-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--line);
  }
  .panel-head h2 {
    font-size: 12px;
    font-weight: 600;
    margin: 0;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .panel-head .sub { font-size: 11px; color: var(--muted); }

  #map { height: 460px; border: 1px solid var(--line); background: #0f1216; }

  button {
    background: transparent;
    color: var(--amber);
    border: 1px solid var(--amber);
    padding: 5px 12px;
    font-size: 11px;
    font-family: "IBM Plex Mono", Consolas, monospace;
    cursor: pointer;
    letter-spacing: 0.05em;
  }
  button:hover { background: rgba(242, 183, 5, 0.12); }

  .log { max-height: 440px; overflow-y: auto; }
  .log-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 4px;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
  }
  .log-row:last-child { border-bottom: none; }
  .tick { width: 4px; height: 22px; flex-shrink: 0; background: var(--slate); }
  .tick.accepted { background: var(--teal); }
  .tick.in_progress { background: var(--amber); }
  .tick.completed { background: #6FA98A; }
  .tick.cancelled { background: var(--brick); }
  .log-route { flex: 1; }
  .log-status {
    font-family: "IBM Plex Mono", Consolas, monospace;
    font-size: 10.5px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  #nearbyResult { margin-top: 12px; }
  .nearby-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 4px;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
  }
  .nearby-score { color: var(--amber); }

  .legend { display: flex; gap: 18px; font-size: 11.5px; color: var(--muted); margin: 0 0 10px; }
  .legend span::before {
    content: "";
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 6px;
    background: var(--c);
  }

  .hint { font-size: 12px; color: var(--muted); line-height: 1.7; margin-bottom: 8px; }
  .empty { color: var(--muted); font-size: 13px; padding: 24px 0; text-align: center; }

  /* Dark-map look from standard OSM tiles: invert only the tile layer,
     so markers and the search circle keep their own colors. */
  .leaflet-tile-pane {
    filter: invert(1) hue-rotate(180deg) brightness(0.9) contrast(0.85) saturate(0.6);
  }
  .leaflet-container { background: #0f1216; }

  .leaflet-popup-content-wrapper, .leaflet-popup-tip {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 2px;
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--line); }

  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    .stat-strip { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<header>
  <div class="title">GEO-TAXI <span class="dim">/ dispatch console</span></div>
  <div class="clock" id="clock">--:--:--</div>
</header>

<div class="stat-strip">
  <div class="stat"><div class="val" id="statOnline">–</div><div class="lbl">Drivers online</div></div>
  <div class="stat teal"><div class="val" id="statOnTrip">–</div><div class="lbl">On trip</div></div>
  <div class="stat"><div class="val" id="statTrips">–</div><div class="lbl">Trips logged</div></div>
  <div class="stat"><div class="val" id="statRevenue">–</div><div class="lbl">Total revenue (Toman)</div></div>
</div>

<div class="layout">
  <div class="panel">
    <div class="panel-head">
      <h2>Driver positions</h2>
      <span class="sub mono">LIVE · 5s</span>
    </div>
    <div class="legend">
      <span style="--c: #F2B705">Online</span>
      <span style="--c: #3FA796">On trip</span>
      <span style="--c: #4B5563">Offline</span>
    </div>
    <div class="hint">Click anywhere on the map to run a live <span class="mono">$near</span> query on the <span class="mono">2dsphere</span> index and find the nearest online drivers.</div>
    <div id="map"></div>
    <div id="nearbyResult"></div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <h2>Trip log</h2>
      <button onclick="loadTrips()">↻ REFRESH</button>
    </div>
    <div class="log" id="tripsList"><div class="empty">Loading...</div></div>
  </div>
</div>

<script>
const API = window.location.origin;
const TEHRAN = [35.6892, 51.389];

function tickClock() {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-GB');
}
tickClock();
setInterval(tickClock, 1000);

const map = L.map('map').setView(TEHRAN, 12);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors',
  maxZoom: 19,
}).addTo(map);

let driverMarkers = [];
let clickMarker = null;
let nearbyCircle = null;

const statusColor = { online: '#F2B705', offline: '#4B5563', on_trip: '#3FA796' };
const driverStatusLabel = { online: 'Online', offline: 'Offline', on_trip: 'On trip' };
const tripStatusLabel = {
  requested: 'Requested', accepted: 'Accepted', in_progress: 'In progress',
  completed: 'Completed', cancelled: 'Cancelled'
};

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

async function loadDrivers() {
  try {
    const res = await fetch(`${API}/drivers`);
    const drivers = await res.json();
    if (!Array.isArray(drivers)) return;

    driverMarkers.forEach(m => map.removeLayer(m));
    driverMarkers = [];
    let online = 0, onTrip = 0;

    drivers.forEach(d => {
      if (d.status === 'online') online++;
      if (d.status === 'on_trip') onTrip++;
      const [lng, lat] = d.currentLocation.coordinates;
      const marker = L.circleMarker([lat, lng], {
        radius: 6,
        fillColor: statusColor[d.status] || '#999',
        color: '#0B0D10',
        weight: 1.5,
        fillOpacity: 0.95,
      }).addTo(map);
      const rating = d.rating && typeof d.rating.avg === 'number' ? d.rating.avg.toFixed(1) : '-';
      marker.bindPopup(
        `<b>${escapeHtml(d.name)}</b><br/>${escapeHtml(d.vehicle && d.vehicle.model)} · ${escapeHtml(d.vehicle && d.vehicle.color)}<br/>${driverStatusLabel[d.status] || escapeHtml(d.status)} · ${rating}★`
      );
      driverMarkers.push(marker);
    });

    document.getElementById('statOnline').textContent = online;
    document.getElementById('statOnTrip').textContent = onTrip;
  } catch (err) {
    console.error('driver load error:', err);
  }
}

async function loadTrips() {
  const container = document.getElementById('tripsList');
  try {
    const res = await fetch(`${API}/trips?limit=20`);
    const trips = await res.json();
    if (!Array.isArray(trips) || trips.length === 0) {
      container.innerHTML = '<div class="empty">No trips logged yet</div>';
      return;
    }

    let totalRevenue = 0;
    trips.forEach(t => { if (t.status === 'completed') totalRevenue += (t.fare || 0); });
    document.getElementById('statTrips').textContent = trips.length;
    document.getElementById('statRevenue').textContent = totalRevenue.toLocaleString('en-US');

    container.innerHTML = trips.map(t => `
      <div class="log-row">
        <div class="tick ${escapeHtml(t.status)}"></div>
        <div class="log-route">${escapeHtml(t.riderId && t.riderId.name || '-')} → ${escapeHtml(t.driverId && t.driverId.name || 'Unassigned')}</div>
        <div class="log-status">${tripStatusLabel[t.status] || escapeHtml(t.status)}</div>
      </div>
    `).join('');
  } catch (err) {
    container.innerHTML = '<div class="empty">Failed to load trips</div>';
    console.error(err);
  }
}

map.on('click', async (e) => {
  const { lat, lng } = e.latlng;

  if (clickMarker) map.removeLayer(clickMarker);
  if (nearbyCircle) map.removeLayer(nearbyCircle);

  clickMarker = L.marker([lat, lng]).addTo(map).bindPopup('Search point').openPopup();
  nearbyCircle = L.circle([lat, lng], {
    radius: 5000, color: '#F2B705', weight: 1, fillOpacity: 0.04
  }).addTo(map);

  const box = document.getElementById('nearbyResult');
  box.innerHTML = '<div class="hint mono">querying $near ...</div>';

  try {
    const res = await fetch(`${API}/drivers/nearby?lng=${lng}&lat=${lat}&maxDistance=5000`);
    const drivers = await res.json();

    if (!Array.isArray(drivers) || drivers.length === 0) {
      box.innerHTML = '<div class="hint">No online drivers found within 5 km.</div>';
      return;
    }

    box.innerHTML = drivers.map(d => {
      const score = d.rating && typeof d.rating.avg === 'number' ? d.rating.avg.toFixed(1) : '5.0';
      return `<div class="nearby-row"><span>${escapeHtml(d.name)} · ${escapeHtml(d.vehicle && d.vehicle.model)}</span><span class="nearby-score mono">${score}★</span></div>`;
    }).join('');
  } catch (err) {
    box.innerHTML = '<div class="hint">Could not reach the server.</div>';
    console.error(err);
  }
});

loadDrivers();
loadTrips();
setInterval(loadDrivers, 5000);
setInterval(loadTrips, 8000);
</script>
</body>
</html>
