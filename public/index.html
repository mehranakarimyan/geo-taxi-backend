<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>🚕 داشبورد سیستم تاکسی NoSQL</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Tahoma, Arial, sans-serif;
    margin: 0;
    background: #0f1420;
    color: #e8ecf3;
  }
  header {
    padding: 16px 24px;
    background: #141a2b;
    border-bottom: 1px solid #232c42;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 { font-size: 20px; margin: 0; }
  header .live {
    font-size: 12px;
    color: #7ee787;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #7ee787;
    box-shadow: 0 0 8px #7ee787;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    padding: 16px 24px;
  }
  .stat-card {
    background: #141a2b;
    border: 1px solid #232c42;
    border-radius: 10px;
    padding: 14px 16px;
  }
  .stat-card .num { font-size: 26px; font-weight: bold; }
  .stat-card .label { font-size: 12px; color: #9aa5bd; margin-top: 4px; }
  .stat-card.green .num { color: #7ee787; }
  .stat-card.orange .num { color: #f0b35c; }
  .stat-card.blue .num { color: #6ea8fe; }
  .stat-card.pink .num { color: #f38ba8; }

  .layout {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 16px;
    padding: 0 24px 24px;
  }
  .panel {
    background: #141a2b;
    border: 1px solid #232c42;
    border-radius: 10px;
    padding: 14px 16px;
  }
  .panel h2 {
    font-size: 15px;
    margin: 0 0 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .hint { font-size: 12px; color: #9aa5bd; margin-bottom: 10px; }
  #map { height: 480px; border-radius: 8px; }

  .list { max-height: 440px; overflow-y: auto; }
  .item {
    padding: 10px;
    border-bottom: 1px solid #1e2537;
    font-size: 13px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .item:last-child { border-bottom: none; }
  .badge {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 20px;
    font-weight: bold;
  }
  .badge.online { background: #103b22; color: #7ee787; }
  .badge.offline { background: #3a2323; color: #f38ba8; }
  .badge.on_trip { background: #3d3320; color: #f0b35c; }
  .badge.requested { background: #232c42; color: #9aa5bd; }
  .badge.accepted { background: #103b22; color: #7ee787; }
  .badge.in_progress { background: #3d3320; color: #f0b35c; }
  .badge.completed { background: #16324f; color: #6ea8fe; }
  .badge.cancelled { background: #3a2323; color: #f38ba8; }

  button {
    background: #2b3a5c;
    color: #e8ecf3;
    border: 1px solid #3a4a70;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
  }
  button:hover { background: #3a4a70; }

  #nearbyResult { margin-top: 10px; font-size: 13px; }
  .empty { color: #6b7488; font-size: 13px; text-align: center; padding: 20px; }
</style>
</head>
<body>

<header>
  <h1>🚕 داشبورد سیستم تاکسی اینترنتی (NoSQL)</h1>
  <div class="live"><span class="dot"></span> به‌روزرسانی زنده هر ۵ ثانیه</div>
</header>

<div class="stats" id="stats">
  <div class="stat-card green"><div class="num" id="statOnline">–</div><div class="label">رانندگان آنلاین</div></div>
  <div class="stat-card orange"><div class="num" id="statOnTrip">–</div><div class="label">در حال سفر</div></div>
  <div class="stat-card blue"><div class="num" id="statTrips">–</div><div class="label">سفرهای اخیر</div></div>
  <div class="stat-card pink"><div class="num" id="statRevenue">–</div><div class="label">مجموع درآمد (تومان)</div></div>
</div>

<div class="layout">
  <div class="panel">
    <h2>📍 موقعیت لحظه‌ای رانندگان</h2>
    <div class="hint">روی نقشه کلیک کن تا نزدیک‌ترین رانندگان آنلاین به همون نقطه پیدا بشن (کوئری $near زنده)</div>
    <div id="map"></div>
    <div id="nearbyResult"></div>
  </div>

  <div class="panel">
    <h2>🚗 سفرهای اخیر <button onclick="loadTrips()">تازه‌سازی</button></h2>
    <div class="list" id="tripsList"><div class="empty">در حال بارگذاری...</div></div>
  </div>
</div>

<script>
const API = window.location.origin; // همون سروری که داشبورد رو سرو می‌کنه
const TEHRAN = [35.6892, 51.389];

const map = L.map('map').setView(TEHRAN, 12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap contributors',
  maxZoom: 18,
}).addTo(map);

let driverMarkers = [];
let clickMarker = null;
let nearbyCircle = null;

const statusColor = { online: '#2ecc71', offline: '#7f8c8d', on_trip: '#f39c12' };
const statusFa = { online: 'آنلاین', offline: 'آفلاین', on_trip: 'در سفر' };

function clearDriverMarkers() {
  driverMarkers.forEach(m => map.removeLayer(m));
  driverMarkers = [];
}

async function loadDrivers() {
  try {
    const res = await fetch(`${API}/drivers`);
    const drivers = await res.json();
    if (!Array.isArray(drivers)) return;

    clearDriverMarkers();
    let online = 0, onTrip = 0;

    drivers.forEach(d => {
      if (d.status === 'online') online++;
      if (d.status === 'on_trip') onTrip++;
      const [lng, lat] = d.currentLocation.coordinates;
      const marker = L.circleMarker([lat, lng], {
        radius: 7,
        fillColor: statusColor[d.status] || '#999',
        color: '#0f1420',
        weight: 1.5,
        fillOpacity: 0.9,
      }).addTo(map);
      marker.bindPopup(
        `<b>${d.name}</b><br/>${d.vehicle?.model || ''} (${d.vehicle?.color || ''})<br/>وضعیت: ${statusFa[d.status] || d.status}<br/>امتیاز: ${d.rating?.avg?.toFixed(1) ?? '—'} ⭐`
      );
      driverMarkers.push(marker);
    });

    document.getElementById('statOnline').textContent = online;
    document.getElementById('statOnTrip').textContent = onTrip;
  } catch (err) {
    console.error('خطا در بارگذاری رانندگان:', err);
  }
}

async function loadTrips() {
  const container = document.getElementById('tripsList');
  try {
    const res = await fetch(`${API}/trips?limit=20`);
    const trips = await res.json();
    if (!Array.isArray(trips) || trips.length === 0) {
      container.innerHTML = '<div class="empty">هنوز سفری ثبت نشده</div>';
      return;
    }

    let totalRevenue = 0;
    trips.forEach(t => { if (t.status === 'completed') totalRevenue += (t.fare || 0); });
    document.getElementById('statTrips').textContent = trips.length;
    document.getElementById('statRevenue').textContent = totalRevenue.toLocaleString('fa-IR');

    const statusFaTrip = {
      requested: 'درخواست‌شده', accepted: 'پذیرفته‌شده', in_progress: 'در حال انجام',
      completed: 'پایان‌یافته', cancelled: 'لغوشده'
    };

    container.innerHTML = trips.map(t => `
      <div class="item">
        <span>${t.riderId?.name || '—'} ← ${t.driverId?.name || 'بدون راننده'}</span>
        <span class="badge ${t.status}">${statusFaTrip[t.status] || t.status}</span>
      </div>
    `).join('');
  } catch (err) {
    container.innerHTML = '<div class="empty">خطا در دریافت سفرها</div>';
    console.error(err);
  }
}

map.on('click', async (e) => {
  const { lat, lng } = e.latlng;

  if (clickMarker) map.removeLayer(clickMarker);
  if (nearbyCircle) map.removeLayer(nearbyCircle);

  clickMarker = L.marker([lat, lng]).addTo(map).bindPopup('نقطه‌ی جستجو').openPopup();
  nearbyCircle = L.circle([lat, lng], { radius: 5000, color: '#6ea8fe', fillOpacity: 0.05 }).addTo(map);

  const resultBox = document.getElementById('nearbyResult');
  resultBox.innerHTML = 'در حال جستجوی نزدیک‌ترین رانندگان...';

  try {
    const res = await fetch(`${API}/drivers/nearby?lng=${lng}&lat=${lat}&maxDistance=5000`);
    const drivers = await res.json();

    if (!Array.isArray(drivers) || drivers.length === 0) {
      resultBox.innerHTML = '<div class="hint">هیچ راننده‌ی آنلاینی در شعاع ۵ کیلومتری پیدا نشد.</div>';
      return;
    }

    resultBox.innerHTML = `<b>${drivers.length} راننده‌ی نزدیک پیدا شد:</b>` + drivers.map(d =>
      `<div class="item"><span>${d.name} — ${d.vehicle?.model || ''}</span><span class="badge online">${(d.rating?.avg ?? 5).toFixed(1)} ⭐</span></div>`
    ).join('');
  } catch (err) {
    resultBox.innerHTML = 'خطا در ارتباط با سرور.';
    console.error(err);
  }
});

// بارگذاری اولیه + به‌روزرسانی خودکار
loadDrivers();
loadTrips();
setInterval(loadDrivers, 5000);
setInterval(loadTrips, 8000);
</script>
</body>
</html>
